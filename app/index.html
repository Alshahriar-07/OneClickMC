<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' app:; img-src 'self' app: data:; style-src 'self' app: 'unsafe-inline'; font-src 'self' app: data:; script-src 'self' app:; connect-src 'self' app:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OneClickMC</title>
    <link rel="stylesheet" href="/app/styles/app.css" />
  </head>
  <body>
    <div class="bg-image" aria-hidden="true"></div>
    <div class="bg-scrim" aria-hidden="true"></div>

    <a class="skip-link" href="#view">Skip to content</a>

    <header class="topbar">
      <button class="brand" data-action="nav" data-screen="home" aria-label="OneClickMC home">
        <img class="brand-logo" src="/assets/logo.png" alt="" />
        <span class="brand-text">
          <img class="brand-word" src="/assets/text.png" alt="OneClickMC" />
          <span class="brand-tag">Minecraft profile installer</span>
        </span>
      </button>

      <nav class="topnav" aria-label="Main navigation">
        <button class="topnav-btn" data-action="nav" data-screen="home">Home</button>
        <button class="topnav-btn" data-action="nav" data-screen="setup">Install profile</button>
        <button class="topnav-btn" data-action="nav" data-screen="settings">Settings</button>
        <button class="topnav-btn" data-action="nav" data-screen="diagnostics">Diagnostics</button>
      </nav>
    </header>

    <main id="view" tabindex="-1"></main>

    <footer class="footer-bar" id="footer-bar"></footer>

    <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

    <div id="loading-overlay" class="overlay" hidden>
      <div class="overlay-card" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span id="loading-message">Working…</span>
      </div>
    </div>

    <dialog id="confirm-dialog" class="modal" aria-labelledby="confirm-title">
      <form method="dialog" class="modal-body-wrap">
        <h2 id="confirm-title" class="modal-title">Confirm</h2>
        <p id="confirm-body" class="modal-text"></p>
        <div class="modal-actions">
          <button value="cancel" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
          <button value="confirm" class="btn btn-primary" id="confirm-yes">Confirm</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app/js/app.js"></script>
  </body>
</html>
